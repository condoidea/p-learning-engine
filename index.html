<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="shared/cloud.js?v=1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEARNING ENGINE｜コース選択</title>
<meta name="theme-color" content="#05060f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Orbitron:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine/css/style.css?v=10">
<style>
  body { background: radial-gradient(ellipse at 20% 0%, #1a1550 0%, var(--bg) 55%) fixed; }
  .hub { max-width: 1000px; margin: 0 auto; padding: 32px 16px 60px; }
  .hub-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .hub-logo { font-family: var(--f-latin); font-weight: 900; font-size: clamp(22px, 4vw, 32px); letter-spacing: .06em; }
  .hub-logo span { font-style: italic; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hub-sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .profile { display: flex; gap: 10px; align-items: center; }
  .pf { padding: 8px 14px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); text-align: center; min-width: 88px; }
  .pf small { display: block; color: var(--muted); font-size: 11px; }
  .pf b { font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .course { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 16px; text-decoration: none; color: var(--text); overflow: hidden;
    background: linear-gradient(160deg, rgba(20,26,60,.9), rgba(10,12,30,.9)); border: 1px solid var(--line); transition: transform .25s, box-shadow .25s; }
  .course::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--c1), var(--c2)); }
  .course:hover { transform: translateY(-6px); box-shadow: 0 20px 50px -20px var(--c1); }
  .course .ico { font-size: 40px; line-height: 1; }
  .course .brand { font-family: var(--f-latin); font-weight: 900; font-size: 12px; letter-spacing: .25em; color: var(--c1); }
  .course h2 { margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 22px; line-height: 1.35; }
  .course p { margin: 0; color: #c9d4ef; font-size: 14px; line-height: 1.7; }
  .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--c2), var(--c1)); box-shadow: 0 0 10px var(--c1); }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .go { align-self: flex-start; margin-top: 4px; padding: 8px 18px; border-radius: 10px; background: linear-gradient(120deg, var(--c1), var(--c2)); color: #05060f; font-weight: 700; font-size: 14px; }
  .soon { border-style: dashed; background: transparent; justify-content: center; align-items: center; text-align: center; min-height: 220px; color: var(--muted); }
  .soon::before { display: none; }
  .soon:hover { transform: none; box-shadow: none; }
  .soon b { font-size: 15px; color: var(--text); }
  .course .del { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: rgba(0,0,0,.3); color: var(--muted); font-size: 13px; cursor: pointer; }
  .course .body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .course .pct { display: none; }

  /* 表示の切りかえ（カード／バナー／リスト） */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .toolbar .count { color: var(--muted); font-size: 13px; }
  .view-pick { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .views { display: flex; padding: 3px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); }
  .views button { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border: 0; border-radius: 9px; background: none; color: var(--muted); cursor: pointer; }
  .views button svg { width: 16px; height: 16px; flex: none; }
  .views button[aria-pressed="true"] { background: rgba(255,255,255,.12); color: var(--text); }

  /* バナー：横長1列。左にアイコンの帯、右に「つづける」 */
  .grid.v-banner { grid-template-columns: 1fr; gap: 12px; }
  .v-banner .course { flex-direction: row; align-items: center; gap: 18px; padding: 0 20px 0 0; min-height: 124px; }
  .v-banner .course::before { inset: 0 auto 0 0; width: 4px; height: auto; background: linear-gradient(180deg, var(--c1), var(--c2)); }
  .v-banner .course:hover { transform: translateY(-3px); }
  .v-banner .ico { align-self: stretch; flex: none; width: 116px; display: flex; align-items: center; justify-content: center; font-size: 54px;
    background: rgba(255,255,255,.04); background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 28%, transparent), color-mix(in srgb, var(--c2) 16%, transparent)); }
  .v-banner .body { flex: 1; gap: 6px; padding: 16px 0; }
  .v-banner h2, .v-list h2 { font-family: var(--f-body); font-weight: 700; letter-spacing: .02em; }
  .v-banner h2 { font-size: 20px; }
  .v-banner p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.6; }
  .v-banner .bar { height: 6px; margin-top: 4px; }
  .v-banner .go { flex: none; align-self: center; margin: 0; }
  @media (max-width: 600px) {
    .v-banner .course { gap: 14px; padding-right: 14px; min-height: 112px; }
    .v-banner .ico { width: 76px; font-size: 38px; }
    .v-banner h2 { font-size: 17px; }
    .v-banner .go { display: none; }
  }

  /* リスト：1行ずつ小さく。名前と進み具合だけ */
  .grid.v-list { grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 8px; }
  .v-list .course { flex-direction: row; align-items: center; gap: 14px; padding: 12px 16px 12px 18px; border-radius: 12px; }
  .v-list .course::before { inset: 0 auto 0 0; width: 3px; height: auto; background: linear-gradient(180deg, var(--c1), var(--c2)); }
  .v-list .course:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -16px var(--c1); }
  .v-list .ico { font-size: 28px; flex: none; }
  .v-list .body { flex: 1; gap: 6px; }
  .v-list h2 { font-size: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .v-list .brand, .v-list p, .v-list .meta, .v-list .go { display: none; }
  .v-list .bar { height: 5px; }
  .v-list .pct { display: block; flex: none; min-width: 3em; text-align: right; font-family: var(--f-latin); font-weight: 700; font-size: 14px; color: var(--c1); }
  .v-list .del, .v-banner .del { position: static; flex: none; width: 26px; height: 26px; font-size: 11px; }
  .v-banner .del { order: 1; }

  /* クラウド保存（設定は cloud.html） */
  .cloud-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 28px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--glass); color: var(--muted); font-size: 13px; text-decoration: none; }
  .cloud-link i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .cloud-link i.on { background: var(--ok); }
  .cloud-link i.ng { background: var(--ng); }
</style>
</head>
<body>
<div class="hub">
  <header class="hub-head">
    <div>
      <div class="hub-logo">LEARNING <span>ENGINE</span></div>
      <p class="hub-sub">わかるまで教えて、忘れる前に思い出させる。コースを選んでスタート。</p>
    </div>
    <div class="profile">
      <div class="pf"><small>LEVEL</small><b id="pfLv">1</b></div>
      <div class="pf"><small>🔥 STREAK</small><b id="pfStreak">0</b></div>
    </div>
  </header>
  <div class="toolbar">
    <span class="count" id="count"></span>
    <div class="view-pick"><span id="viewLabel">表示</span>
      <div class="views" id="views" role="group" aria-labelledby="viewLabel">
        <button type="button" data-view="card" aria-pressed="false" aria-label="カード" title="カード"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg></button>
        <button type="button" data-view="banner" aria-pressed="false" aria-label="バナー" title="バナー"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="5" rx="1.5"/><rect x="1" y="9" width="14" height="5" rx="1.5"/></svg></button>
        <button type="button" data-view="list" aria-pressed="false" aria-label="リスト" title="リスト"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2.5" rx="1"/><rect x="1" y="6.75" width="14" height="2.5" rx="1"/><rect x="1" y="11.5" width="14" height="2.5" rx="1"/></svg></button>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <a class="cloud-link" href="cloud.html"><i id="cloudDot"></i>クラウド保存：<span id="cloudSt">オフ</span></a>
</div>

<script src="courses/registry.js?v=20"></script>
<script src="vocab/js/decks.js?v=15"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  'use strict';
  function read(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  /* レベル計算はエンジン（core.js）と同じ式 */
  function levelOf(xp) { var lv = 1; while (xp >= 60 + lv * 30) { xp -= 60 + lv * 30; lv++; } return lv; }
  var P = read('le.profile.v1') || {};
  document.getElementById('pfLv').textContent = levelOf(P.totalXp || 0);
  document.getElementById('pfStreak').textContent = (P.streak && P.streak.count) || 0;

  var grid = document.getElementById('grid');
  /* 端末に読み込んだ単語デッキ（参考書連動版など）も並べる */
  var imported = (window.VocabDecks ? VocabDecks.list() : []).map(function (d) {
    return { id: d.id, kind: 'vocab', imported: true, entry: 'vocab.html?deck=' + encodeURIComponent(d.id), storageKey: 'vocab.' + d.id + '.v1',
      title: d.title, brand: d.brand, icon: '📗', desc: (d.book ? '『' + d.book + '』と連動。' : '') + (d.sub || '') + '（¡VAMOS! に読み込んだ参考書のデッキ）',
      color: '#5cc3e0', color2: '#f2a541', words: d.words };
  });
  (window.LE_COURSES || []).concat(imported).forEach(function (c) {
    var S = read(c.storageKey) || {};
    var vocab = c.kind === 'vocab';
    var done = vocab ? Object.keys(S.cards || {}).length : Object.keys(S.lessons || {}).filter(function (k) { return S.lessons[k] && S.lessons[k].done; }).length;
    var all = vocab ? c.words : c.lessons;
    var pct = all ? Math.round(done / all * 100) : 0;
    var last = vocab ? Object.keys(S.cards || {}).reduce(function (m, k) { return Math.max(m, S.cards[k].last || 0); }, 0)
                     : P.courses && P.courses[c.id] && P.courses[c.id].last;
    var a = document.createElement('a');
    a.className = 'course';
    a.href = c.entry;
    a.style.setProperty('--c1', c.color || '#38e8ff');
    a.style.setProperty('--c2', c.color2 || '#7a5cff');
    a.innerHTML = '<span class="ico">' + esc(c.icon || '📘') + '</span>' +
      '<div class="body"><span class="brand">' + esc(c.brand || '') + '</span>' +
      '<h2>' + esc(c.title) + '</h2><p>' + esc(c.desc || '') + '</p>' +
      '<div class="bar"><i data-w="' + pct + '"></i></div>' +
      '<div class="meta"><span>' + (vocab ? '図鑑 ' : 'レッスン ') + done + ' / ' + (all || '?') + '</span><span>' + (last ? '最終学習 ' + new Date(last).toLocaleDateString('ja-JP') : '未開始') + '</span></div></div>' +
      '<span class="pct">' + pct + '%</span>' +
      '<span class="go">' + (done ? 'つづける ▶' : 'はじめる ▶') + '</span>' +
      (c.imported ? '<button class="del" data-del="' + esc(c.id) + '" aria-label="端末から消す">✕</button>' : '');
    grid.appendChild(a);
  });
  grid.addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]'); if (!b) return;
    e.preventDefault();
    var id = b.dataset.del;
    if (!confirm('デッキ「' + id + '」をこの端末から消しますか？')) return;
    var withP = confirm('進み具合（図鑑・経験値）も消しますか？\n［キャンセル］なら進み具合は残り、同じデッキを読み込み直すと続きから使えます。');
    VocabDecks.remove(id, withP);
    location.reload();
  });
  document.getElementById('count').textContent = grid.children.length + ' コース';

  /* 表示の切りかえ。選んだものは端末に覚えておく */
  var VIEW_KEY = 'le.hub.view';
  var views = document.getElementById('views');
  function setView(v, animate) {
    if (['card', 'banner', 'list'].indexOf(v) < 0) v = 'card';
    grid.className = 'grid v-' + v;
    views.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.view === v ? 'true' : 'false'); });
    try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
    if (animate && window.gsap) gsap.fromTo('.course', { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, stagger: 0.03, ease: 'power2.out', clearProps: 'transform,opacity' });
  }
  var saved = null;
  try { saved = localStorage.getItem(VIEW_KEY); } catch (e) {}
  setView(saved, false);
  views.addEventListener('click', function (e) {
    var b = e.target.closest('[data-view]');
    if (b && b.getAttribute('aria-pressed') !== 'true') setView(b.dataset.view, true);
  });

  /* クラウド保存の状態 */
  if (window.LECloud) {
    var cs = LECloud.state();
    if (cs.linked && !cs.broken) {
      document.getElementById('cloudSt').textContent = cs.err ? '同期できていません' : 'オン（' + cs.email + '）';
      document.getElementById('cloudDot').className = cs.err ? 'ng' : 'on';
    } else if (cs.broken) document.getElementById('cloudSt').textContent = 'ログインし直してください';
  }

  if (window.gsap) {
    gsap.from('.hub-head > *', { y: -20, opacity: 0, duration: 0.6, stagger: 0.1, ease: 'expo.out' });
    gsap.from('.course', { y: 40, opacity: 0, duration: 0.7, stagger: 0.1, ease: 'back.out(1.6)', delay: 0.2 });
    document.querySelectorAll('.bar i').forEach(function (i) { gsap.to(i, { width: i.dataset.w + '%', duration: 1.2, delay: 0.6, ease: 'power3.out' }); });
  } else document.querySelectorAll('.bar i').forEach(function (i) { i.style.width = i.dataset.w + '%'; });
})();
</script>
</body>
</html>
