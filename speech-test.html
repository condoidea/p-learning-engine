<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>読み上げの診断</title>
<style>
  body { font: 17px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; padding: 16px 14px 60px; background: #f6f4ef; color: #222; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  p { margin: 6px 0 12px; }
  .t { background: #fff; border-radius: 12px; padding: 12px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .t b { display: block; margin-bottom: 8px; }
  button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid #999; background: #fff; color: #222; margin: 3px 4px 3px 0; }
  button.go { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: bold; }
  button.on { background: #222; border-color: #222; color: #fff; }
  .ev { font-size: 14px; color: #555; min-height: 1.4em; word-break: break-all; }
  textarea { width: 100%; box-sizing: border-box; height: 190px; font: 13px/1.4 ui-monospace, monospace; }
  .hear { margin-top: 6px; }
  .small { font-size: 14px; color: #555; }
</style>
<script>
  /* ?raw をつけると、対策（shared/speech-fix.js）なしで開く */
  var RAW = /[?&]raw\b/.test(location.search);
  if (!RAW) document.write('<script src="shared/speech-fix.js?v=2"><\/script>');
</script>
</head>
<body>
<h1>読み上げの診断</h1>
<p><b>消音モードのまま</b>、上から順に <b>▶</b> を押して、<b>聞こえたか</b>を ○ か × で答えてください。最後に、いちばん下の「結果をコピー」を押して、そのまま貼ってください。</p>
<p class="small" id="mode"></p>

<div id="tests"></div>

<div class="t">
  <b>スペイン語の声を1つずつ</b>
  <p class="small">名前を押すと、その声で読みます。聞こえた声だけ ○ にしてください（全部でなくてかまいません）。</p>
  <div id="voices"></div>
</div>

<div class="t">
  <b>結果</b>
  <button class="go" id="copy">結果をコピー</button> <span id="copied" class="small"></span>
  <textarea id="out" readonly></textarea>
</div>

<script>
(function () {
  'use strict';
  var ss = window.speechSynthesis, t0 = Date.now(), R = {}, EV = {}, keep = [];
  var $ = function (s) { return document.querySelector(s); };
  document.getElementById('mode').innerHTML = RAW
    ? '今：<b>対策なし</b>で開いています。 <a href="speech-test.html">対策ありで開く</a>'
    : '今：<b>対策あり</b>で開いています。 <a href="speech-test.html?raw">対策なしで開く</a>';

  function voices() { try { return (ss && ss.getVoices()) || []; } catch (e) { return []; } }
  function esVoices() { return voices().filter(function (v) { return /^es/i.test(v.lang || ''); }); }
  function appVoice() {   /* アプリと同じ選び方 */
    var vs = voices();
    return vs.filter(function (v) { return /^es[-_]ES/i.test(v.lang); })[0] || vs.filter(function (v) { return /^es/i.test(v.lang); })[0] || null;
  }
  function state() { return ss ? ('speaking=' + ss.speaking + ' pending=' + ss.pending + ' paused=' + ss.paused) : 'なし'; }

  function speak(id, text, opt) {
    opt = opt || {};
    var ev = EV[id] = [], box = document.getElementById('ev-' + id), s0 = Date.now();
    function log(m) { ev.push(m + '@' + (Date.now() - s0)); if (box) box.textContent = ev.join(' → '); report(); }
    if (!ss) { log('speechSynthesis なし'); return; }
    try {
      if (opt.cancel) ss.cancel();
      var u = new SpeechSynthesisUtterance(text);
      if (opt.voice) { u.voice = opt.voice; u.lang = opt.voice.lang; } else u.lang = opt.lang || 'es-ES';
      u.rate = 0.9;
      u.onstart = function () { log('start'); };
      u.onend = function () { log('end'); };
      u.onerror = function (e) { log('error:' + (e && e.error)); };
      keep.push(u);
      ss.speak(u);
      log('speak（' + (opt.voice ? opt.voice.name : '声の指定なし ' + u.lang) + '）');
      setTimeout(function () { log('1秒後 ' + state()); }, 1000);
    } catch (e) { log('例外:' + e.message); }
  }

  function beep() {
    var ev = EV.beep = [], box = document.getElementById('ev-beep');
    try {
      var AC = window.AudioContext || window.webkitAudioContext, ac = new AC(), o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 660; g.gain.value = 0.25; o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.6);
      ev.push('beep state=' + ac.state);
    } catch (e) { ev.push('例外:' + e.message); }
    if (box) box.textContent = ev.join(' → '); report();
  }

  /* 無音の音を流しつづける（音の種類が「再生」になり、消音スイッチに従わなくなる、という古くからの手） */
  var hush = null;
  function silentLoop() {
    if (hush) return hush.play();
    var rate = 8000, len = rate / 2, b = new ArrayBuffer(44 + len), d = new DataView(b), i;
    function str(o, t) { for (var k = 0; k < t.length; k++) d.setUint8(o + k, t.charCodeAt(k)); }
    str(0, 'RIFF'); d.setUint32(4, 36 + len, true); str(8, 'WAVEfmt '); d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
    d.setUint32(24, rate, true); d.setUint32(28, rate, true); d.setUint16(32, 1, true); d.setUint16(34, 8, true); str(36, 'data'); d.setUint32(40, len, true);
    for (i = 0; i < len; i++) d.setUint8(44 + i, 128);
    hush = new Audio(URL.createObjectURL(new Blob([b], { type: 'audio/wav' })));
    hush.loop = true; hush.setAttribute('playsinline', '');
    return hush.play();
  }
  function runHush() {
    var box = document.getElementById('ev-hush'), pre = '';
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { pre += 'audioSession 例外 '; }
    var p; try { p = silentLoop(); } catch (e) { pre += '無音の再生 例外:' + e.message + ' '; }
    var go = function (m) { speak('hush', 'Hola, buenos días'); EV.hush.unshift(pre + m); if (box) box.textContent = EV.hush.join(' → '); report(); };
    if (p && p.then) p.then(function () { go('無音の再生OK'); }, function (e) { go('無音の再生NG:' + (e && e.name)); }); else go('無音の再生（返事なし）');
  }

  var TESTS = [
    { id: 'beep', title: '1. 効果音（ピーという音）', note: 'これが聞こえないときは、本体の消音スイッチか音量です。', run: beep },
    { id: 'lang', title: '2. 声を指定しないで読む（Hola, buenos días）', run: function () { speak('lang', 'Hola, buenos días'); } },
    { id: 'app', title: '3. アプリと同じ声の選び方で読む', run: function () { var v = appVoice(); if (v) speak('app', 'Hola, buenos días', { voice: v, cancel: true }); else { EV.app = ['スペイン語の声が見つからない（声の数 ' + voices().length + '）']; document.getElementById('ev-app').textContent = EV.app[0]; report(); } } },
    { id: 'timer', title: '4. 押して2秒後に、自動で読む', note: '押したあと、何もさわらずに待ってください。', run: function () { var v = appVoice(); document.getElementById('ev-timer').textContent = '2秒待っています…'; setTimeout(function () { speak('timer', 'Uno, dos, tres', v ? { voice: v, cancel: true } : { cancel: true }); }, 2000); } },
    { id: 'timerlang', title: '5. 押して2秒後に、声を指定しないで読む', note: '押したあと、何もさわらずに待ってください。', run: function () { document.getElementById('ev-timerlang').textContent = '2秒待っています…'; setTimeout(function () { speak('timerlang', 'Uno, dos, tres'); }, 2000); } },
    { id: 'ja', title: '6. 日本語を読む（こんにちは）', run: function () { speak('ja', 'こんにちは', { lang: 'ja-JP' }); } },
    { id: 'hush', title: '7. 無音の音を流しながら読む（消音モード用の別の方法）', note: '消音モードのまま試してください。一度押すと、このページを閉じるまで無音の音が流れつづけます。', run: runHush }
  ];

  function hearBtns(id) {
    return '<div class="hear">聞こえた？ <button data-hear="' + id + '" data-v="○">○ 聞こえた</button><button data-hear="' + id + '" data-v="×">× 聞こえない</button></div>';
  }
  $('#tests').innerHTML = TESTS.map(function (t) {
    return '<div class="t"><b>' + t.title + '</b>' + (t.note ? '<p class="small">' + t.note + '</p>' : '') +
      '<button class="go" data-run="' + t.id + '">▶ ためす</button><div class="ev" id="ev-' + t.id + '"></div>' + hearBtns(t.id) + '</div>';
  }).join('');

  function drawVoices() {
    var vs = esVoices(), el = $('#voices');
    if (!vs.length) { el.innerHTML = '<p class="small">スペイン語の声が見つかりません（声の数 ' + voices().length + '）</p>'; return; }
    el.innerHTML = vs.map(function (v, i) {
      return '<div style="margin:8px 0"><button class="go" data-voice="' + i + '">▶ ' + v.name + '（' + v.lang + '）</button>' +
        '<button data-hear="v' + i + '" data-v="○">○</button><button data-hear="v' + i + '" data-v="×">×</button>' +
        '<div class="ev" id="ev-v' + i + '"></div></div>';
    }).join('');
  }
  drawVoices();
  if (ss && 'onvoiceschanged' in ss) ss.addEventListener('voiceschanged', function () { if (!Object.keys(R).some(function (k) { return k.charAt(0) === 'v'; })) drawVoices(); report(); });
  setTimeout(function () { if (!$('#voices button')) drawVoices(); report(); }, 1200);

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.run) { TESTS.filter(function (t) { return t.id === b.dataset.run; })[0].run(); }
    else if (b.dataset.voice) { var i = +b.dataset.voice, v = esVoices()[i]; if (v) speak('v' + i, 'Hola, buenos días', { voice: v, cancel: true }); }
    else if (b.dataset.hear) {
      R[b.dataset.hear] = b.dataset.v;
      [].forEach.call(document.querySelectorAll('[data-hear="' + b.dataset.hear + '"]'), function (x) { x.classList.toggle('on', x === b); });
      report();
    }
  });

  function report() {
    var L = [];
    L.push('読み上げの診断（' + (RAW ? '対策なし' : '対策あり') + '・fixed=' + !!(ss && ss.__fixed) + '）');
    L.push(navigator.userAgent);
    L.push('audioSession=' + (navigator.audioSession ? navigator.audioSession.type : 'なし'));
    L.push('standalone=' + (navigator.standalone === true) + ' 声の数=' + voices().length + ' スペイン語=' + esVoices().length + ' ' + state());
    var av = appVoice(); L.push('アプリが選ぶ声：' + (av ? av.name + ' / ' + av.lang + ' / local=' + av.localService + ' / default=' + av.default : 'なし'));
    TESTS.forEach(function (t) { L.push('[' + t.id + '] 聞こえた=' + (R[t.id] || '未') + ' ｜ ' + (EV[t.id] || []).join(' → ')); });
    esVoices().forEach(function (v, i) {
      var k = 'v' + i;
      L.push('[声] ' + v.name + ' / ' + v.lang + ' / local=' + v.localService + ' / default=' + v.default + ' ｜ 聞こえた=' + (R[k] || '未') + ' ｜ ' + (EV[k] || []).join(' → '));
    });
    L.push('日本語の声：' + voices().filter(function (v) { return /^ja/i.test(v.lang || ''); }).map(function (v) { return v.name; }).join('、'));
    $('#out').value = L.join('\n');
  }
  report();

  $('#copy').addEventListener('click', function () {
    var ta = $('#out'), ok = function () { $('#copied').textContent = 'コピーしました'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, function () { ta.select(); document.execCommand('copy'); ok(); });
    else { ta.select(); document.execCommand('copy'); ok(); }
  });
})();
</script>
</body>
</html>
