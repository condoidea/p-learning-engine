<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡QUE FUSIÓN!｜スペイン語の関係詞</title>
<meta name="theme-color" content="#12062b">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="relativo/css/relativo.css?v=1">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="app">

  <!-- ============ ホーム ============ -->
  <section id="home" class="screen">
    <header class="topbar">
      <a class="back" href="index.html" aria-label="コース一覧へ">←</a>
      <button class="lv" id="hLv" aria-label="レベル"><b id="hLvN">1</b><span class="lv-bar"><i id="hLvBar"></i></span><small id="hLvTi"></small></button>
      <span class="chip" id="hStreak" title="連続日数">🔥 <b>0</b></span>
      <span class="chip" id="hTix" title="ガチャチケット">🎟 <b>0</b></span>
    </header>

    <div class="hero">
      <h1 class="logo"><span class="l1">¡QUE</span><span class="l2">FUSIÓN!</span><small>スペイン語の関係詞 ・ 西検4級</small></h1>
      <div class="hero-bot">
        <div class="bot-av" id="hBot"></div>
        <p class="bot-bub" id="hGreet"></p>
      </div>
      <button class="cta" id="hCta"></button>
    </div>

    <div class="quick">
      <button class="qb" id="hReview"><span class="qi">🔁</span><b>復習</b><small id="hDue"></small></button>
      <button class="qb" id="hRush"><span class="qi">⚡</span><b>ラッシュ</b><small id="hRushBest"></small></button>
      <button class="qb" id="hGacha"><span class="qi">🎰</span><b>ガチャ</b><small id="hGachaN"></small></button>
      <button class="qb" id="hDex"><span class="qi">🃏</span><b>図鑑</b><small id="hDexN"></small></button>
      <button class="qb" id="hTips"><span class="qi">💡</span><b>Tips</b><small id="hTipsN"></small></button>
    </div>

    <section class="missions" id="hMis"></section>

    <h2 class="sec">ステージマップ<small>1日30分 × 7日で、ぜんぶ回れる</small></h2>
    <div class="map" id="hMap"></div>

    <div class="settings">
      <label><input type="checkbox" id="tgSound"> 🔈 効果音</label>
      <label><input type="checkbox" id="tgSpeak"> 🗣 例文を自動で読む</label>
      <button class="link" id="hReset">記録をリセット</button>
    </div>
  </section>

  <!-- ============ レッスン（トーク） ============ -->
  <section id="play" class="screen" hidden>
    <header class="pbar">
      <button class="x" id="pQuit" aria-label="やめる">✕</button>
      <div class="pmid"><b id="pTitle"></b><span class="prog"><i id="pProg"></i></span></div>
      <div class="pxp"><small>XP</small><b id="pXp">0</b></div>
    </header>
    <main id="feed" aria-live="polite"></main>
    <div class="tray" id="tray"></div>
  </section>

  <!-- ============ ボス・ラッシュ・復習 ============ -->
  <section id="quiz" class="screen" hidden>
    <header class="pbar">
      <button class="x" id="zQuit" aria-label="やめる">✕</button>
      <div class="pmid"><b id="zTitle"></b><span class="prog"><i id="zProg"></i></span></div>
      <div class="pxp" id="zRight"></div>
    </header>
    <div id="zHud"></div>
    <main id="zMain"></main>
    <div class="tray" id="zTray"></div>
  </section>

  <!-- ============ 結果 ============ -->
  <section id="done" class="screen" hidden></section>

  <!-- ============ ガチャ ============ -->
  <section id="gacha" class="screen" hidden></section>

  <!-- ============ 図鑑・Tips ============ -->
  <section id="dex" class="screen" hidden></section>
</div>

<div id="combo" aria-hidden="true"></div>
<div id="slam" aria-hidden="true"></div>
<div id="modal" hidden><div class="mbox"><button class="mclose" aria-label="閉じる">✕</button><div id="mbody"></div></div></div>
<div id="pop" hidden></div>
<div id="toast" aria-live="polite"></div>

<script src="shared/es-words.js?v=1"></script>
<script src="relativo/js/data/lessons.js?v=1"></script>
<script src="relativo/js/data/questions.js?v=1"></script>
<script src="relativo/js/data/cards.js?v=1"></script>
<script src="engine/js/audio.js?v=9"></script>
<script src="relativo/js/fx.js?v=1"></script>
<script src="relativo/js/app.js?v=1"></script>
<script src="news/news.js?v=2"></script>
</body>
</html>
