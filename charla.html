<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="shared/cloud.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHARLA｜スペイン語の会話を聞く・書く・まねる</title>
<meta name="theme-color" content="#14171f">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<script src="shared/smooth-fonts.js?v=1"></script>
<script src="shared/speech-fix.js?v=2"></script>
<link rel="stylesheet" href="charla/css/charla.css?v=1">
</head>
<body>
<div id="app">

  <!-- ============ ホーム：ダイアログの一覧 ============ -->
  <section id="home" class="screen">
    <header class="bar">
      <a class="back" href="index.html" aria-label="コース一覧へ">←</a>
      <h1 class="logo">CHARLA<small>会話を 聞く・書く・まねる</small></h1>
    </header>
    <div class="scroll">
      <ul class="dlist" id="dlist"></ul>
      <button class="wide" id="hWords">📒 調べた単語<span id="hWordsN"></span></button>
      <p class="hint">セリフをタップ → そこから再生して、そのセリフをくり返します。<br>点線の語・いま聞いているセリフの語をタップ → 意味（調べた語は記録され、単語アプリに送れます）。</p>
    </div>
  </section>

  <!-- ============ プレーヤー ============ -->
  <section id="play" class="screen" hidden>
    <header class="bar">
      <button class="back" id="pBack" aria-label="一覧へ">←</button>
      <div class="ttl"><b id="pTitle"></b><small id="pSub"></small></div>
      <button class="icon" id="pWords" aria-label="調べた単語">📒</button>
    </header>
    <nav class="tabs" id="tabs">
      <button data-m="listen" class="on">🎧 聞く</button>
      <button data-m="dict">✍️ 書き取り</button>
      <button data-m="shadow">🗣 シャドーイング</button>
    </nav>

    <!-- 台本（聞く・シャドーイング） -->
    <div class="scroll" id="script"></div>

    <!-- 書き取り -->
    <div class="scroll" id="dict" hidden></div>

    <!-- 操作盤 -->
    <div class="panel" id="panel">
      <div class="seek" id="seek"><div class="segs" id="segs"></div><div class="ab" id="abShade" hidden></div><div class="needle" id="needle"></div></div>
      <div class="times"><span id="tNow">0:00</span><span id="tState"></span><span id="tAll">0:00</span></div>
      <div class="row main">
        <button class="ctl" id="cBack2" aria-label="2秒戻す">⟲<small>2秒</small></button>
        <button class="ctl" id="cPrev" aria-label="前のセリフ">⏮</button>
        <button class="ctl big" id="cPlay" aria-label="再生">▶</button>
        <button class="ctl" id="cNext" aria-label="次のセリフ">⏭</button>
        <button class="ctl" id="cLoop" aria-label="くり返し">🔁<small id="cLoopT">なし</small></button>
      </div>
      <div class="row opts" id="optsListen">
        <button class="chip" id="oSpeed">速さ <b>1.0</b></button>
        <button class="chip" id="oText">文字 <b>見せる</b></button>
        <button class="chip" id="oJa">訳 <b>なし</b></button>
        <span class="abchip" id="abChip" hidden><span id="abT"></span><button id="abMore">＋次</button><button id="abClear" aria-label="AB区間を消す">✕</button></span>
      </div>
      <div class="row opts" id="optsShadow" hidden>
        <button class="chip" id="sSpeed">速さ <b>1.0</b></button>
        <button class="chip" id="sRep">回数 <b>2</b></button>
        <button class="chip" id="sGap">間 <b>×1.5</b></button>
        <button class="chip" id="sRole">役 <b>なし</b></button>
        <button class="chip" id="sText">文字 <b>見せる</b></button>
        <button class="chip" id="sRec">🎙 <b>録音しない</b></button>
      </div>
    </div>
  </section>

  <!-- ============ 調べた単語 → 単語アプリへ ============ -->
  <section id="words" class="screen" hidden>
    <header class="bar">
      <button class="back" id="wBack" aria-label="もどる">←</button>
      <div class="ttl"><b>📒 調べた単語</b><small>チェックした語を単語アプリ（¡VAMOS!）へ</small></div>
    </header>
    <div class="scroll" id="wBody"></div>
    <div class="panel wpanel">
      <div id="wMsg" class="wmsg"></div>
      <div class="row"><button class="ghost" id="wAll">全部</button><button class="ghost" id="wNone">なし</button><button class="go" id="wSend">単語アプリへ送る</button></div>
    </div>
  </section>

  <div id="balloon" class="balloon" hidden></div>
</div>

<script src="shared/es-words.js?v=12"></script>
<script src="vocab/js/conj-es.js?v=37"></script>
<script src="vocab/js/deck-check.js?v=37"></script>
<script src="vocab/js/decks.js?v=37"></script>
<script src="charla/dialogs/list.js?v=1"></script>
<script src="charla/js/text.js?v=1"></script>
<script src="charla/js/app.js?v=1"></script>
</body>
</html>
