<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="shared/cloud.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡MANDA!｜スペイン語の命令表現</title>
<meta name="theme-color" content="#0d0a26">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="manda/css/manda.css?v=3">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="app">

  <!-- ============ ホーム（島の景色） ============ -->
  <section id="home" class="screen">
    <header class="topbar">
      <a class="back" href="index.html" aria-label="コース一覧へ">←</a>
      <button class="lv" id="hLv" aria-label="神格"><b id="hLvN">1</b><span class="lv-bar"><i id="hLvBar"></i></span><small id="hLvTi"></small></button>
      <span class="chip" id="hStreak" title="連続日数">🔥 <b>0</b></span>
      <span class="chip" id="hTix" title="祈りのチケット">🎟 <b>0</b></span>
    </header>
    <h1 class="logo"><span>¡MANDA!</span><small>ちび神さまの世界づくり ・ スペイン語の命令 ・ 西検4級</small></h1>
    <div class="isle-wrap">
      <div class="isle" id="isle" data-overlay-ok></div>
      <span class="popc" id="hPop">👥 人口 <b>1</b></span>
      <div class="ev" id="hEv"></div>
    </div>
    <button class="cta" id="hCta"></button>
    <button class="stop" id="hStop" hidden>✋ あとで（今日はここまで）</button>
    <div class="quick">
      <button class="qb" id="hReview"><span class="qi">🔁</span><b>祈り</b><small id="hDue"></small></button>
      <button class="qb" id="hRush"><span class="qi">⚡</span><b>ラッシュ</b><small id="hRushBest"></small></button>
      <button class="qb" id="hGacha"><span class="qi">✨</span><b>奇跡</b><small id="hGachaN"></small></button>
      <button class="qb" id="hBook"><span class="qi">📖</span><b>創世記</b><small id="hBookN"></small></button>
    </div>
    <button class="mis" id="hMis"></button>
    <div class="settings">
      <label><input type="checkbox" id="tgSound"> 🔈 効果音</label>
      <label><input type="checkbox" id="tgSpeak"> 🗣 命令を読み上げる</label>
      <label><input type="checkbox" id="tgAuto"> ⏩ 次の神託を自動で始める</label>
      <button class="link" id="hReset">記録をリセット</button>
    </div>
  </section>

  <!-- ============ 神託（レッスン） ============ -->
  <section id="play" class="screen fix" hidden>
    <header class="pbar">
      <button class="x" id="pQuit" aria-label="やめる">✕</button>
      <div class="pmid"><b id="pTitle"></b><span class="prog"><i id="pProg"></i></span></div>
      <div class="pxp"><small>XP</small><b id="pXp">0</b></div>
    </header>
    <div class="stage" id="stage"></div>
    <main class="board" id="board" aria-live="polite"></main>
    <div class="talk" id="talk" hidden></div>
    <div class="tray" id="tray"></div>
  </section>

  <!-- ============ ボス・ラッシュ・復習 ============ -->
  <section id="quiz" class="screen fix" hidden>
    <header class="pbar">
      <button class="x" id="zQuit" aria-label="やめる">✕</button>
      <div class="pmid"><b id="zTitle"></b><span class="prog"><i id="zProg"></i></span></div>
      <div class="pxp" id="zRight"></div>
    </header>
    <div id="zHud"></div>
    <main id="zMain" class="board"></main>
    <div class="tray" id="zTray"></div>
  </section>

  <section id="done" class="screen" hidden></section>
  <section id="gacha" class="screen" hidden></section>
  <section id="dex" class="screen" hidden></section>
</div>

<div id="combo" aria-hidden="true"></div>
<div id="slam" aria-hidden="true"></div>
<div id="modal" hidden><div class="mbox"><button class="mclose" aria-label="閉じる">✕</button><div id="mbody"></div></div></div>
<div id="pop" hidden></div>
<div id="toast" aria-live="polite"></div>

<script src="shared/es-words.js?v=2"></script>
<script src="manda/js/data/lessons.js?v=1"></script>
<script src="manda/js/data/questions.js?v=1"></script>
<script src="manda/js/data/cards.js?v=1"></script>
<script src="manda/js/data/world.js?v=2"></script>
<script src="engine/js/audio.js?v=10"></script>
<script src="manda/js/fx.js?v=1"></script>
<script src="manda/js/app.js?v=3"></script>
<script src="news/news.js?v=2"></script>
</body>
</html>
