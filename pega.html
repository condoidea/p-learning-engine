<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script src="shared/cloud.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡PEGA!｜語尾のジェムで戦う</title>
<meta name="theme-color" content="#14213d">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<script src="shared/speech-fix.js?v=2"></script>
<link rel="stylesheet" href="pega/css/pega.css?v=5">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="app">
  <section id="home" class="screen"></section>

  <section id="play" class="screen fix" hidden>
    <header class="pbar">
      <button class="x" id="pQuit" aria-label="やめる">✕</button>
      <div class="pmid"><span class="prog"><i id="pProg"></i></span></div>
      <div class="pxp"><small>XP</small><b id="pXp">0</b></div>
    </header>
    <p class="lead" id="lead" aria-live="polite"></p>
    <main class="bench" id="bench"></main>
    <div id="fb" aria-live="polite"></div>
    <div class="tray" id="tray"></div>
  </section>

  <section id="done" class="screen" hidden></section>
</div>

<div id="combo" aria-hidden="true"></div>
<div id="slam" aria-hidden="true"></div>
<div id="modal" hidden><div class="mbox"><button class="mclose" aria-label="閉じる">✕</button><div id="mbody"></div></div></div>
<div id="pop" hidden></div>

<script src="shared/es-words.js?v=12"></script>
<script src="pega/js/data.js?v=5"></script>
<script src="engine/js/audio.js?v=10"></script>
<script src="pega/js/fx.js?v=2"></script>
<script src="pega/js/app.js?v=5"></script>
<script src="news/news.js?v=4"></script>
</body>
</html>
