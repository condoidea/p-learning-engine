</head>
<body>
<div class="bg" aria-hidden="true" data-overlay-ok><i></i><i></i>
  <svg class="castle" viewBox="0 0 760 220" preserveAspectRatio="xMidYMax meet"><path d="M0 220V170H60V150H70V160H80V150H90V160H100V150H110V170H180V110l20-30 20 30V120H240V100H250V110H260V100H270V110H280V100H290V120H320V60l30-45 30 45V70H410V40l25-40 25 40V90H470V100H480V90H490V100H500V90H510V120H540V110l20-30 20 30V170H650V150H660V160H670V150H680V160H690V150H700V170H760V220Z"/>
  <rect class="win" x="346" y="80" width="8" height="14" rx="4"/><rect class="win" x="431" y="58" width="8" height="14" rx="4"/><rect class="win" x="440" y="120" width="7" height="12" rx="3.5"/><rect class="win" x="197" y="128" width="6" height="10" rx="3"/><rect class="win" x="557" y="128" width="6" height="10" rx="3"/><rect class="win" x="300" y="148" width="6" height="10" rx="3"/></svg>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- ============ はじまり（最初のタップで音と読み上げを使えるようにする） ============ -->
<button id="start" type="button">
  <svg class="crest" viewBox="0 0 120 140" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#f0c75e"/><stop offset="1" stop-color="#9a6a1c"/></linearGradient></defs>
    <path d="M60 4 108 20v44c0 34-22 58-48 72C34 122 12 98 12 64V20Z" fill="#2a160c" stroke="url(#cg)" stroke-width="5"/>
    <path d="M60 14 98 27v37c0 28-17 48-38 60-21-12-38-32-38-60V27Z" fill="none" stroke="#8e1f1f" stroke-width="2"/>
    <polygon points="60,36 82,49 82,75 60,88 38,75 38,49" fill="none" stroke="url(#cg)" stroke-width="3.5"/>
    <g stroke="url(#cg)" stroke-width="3" stroke-linecap="round"><line x1="60" y1="62" x2="60" y2="40"/><line x1="60" y1="62" x2="60" y2="84"/><line x1="60" y1="62" x2="41" y2="62"/><line x1="60" y1="62" x2="79" y2="62"/></g>
    <circle cx="60" cy="62" r="11" fill="#2a160c" stroke="url(#cg)" stroke-width="3"/><text x="60" y="67.5" text-anchor="middle" font-family="Cinzel,serif" font-weight="900" font-size="15" fill="#f0c75e">C</text></svg>
  <span class="st-logo"><small>有機化学 ・ 共通テストの基本</small><b>ユーキ<i>・</i>クエスト</b><span class="st-en">YUKI QUEST</span><em>有機（ユーキ）を出せ！</em></span>
  <span class="st-press">― TAP TO START ―</span>
  <span class="st-note">🔊 BGM と詠唱の読み上げがあります（設定で切りかえ）</span>
</button>

<div id="app">
  <!-- ============ ホーム（地図） ============ -->
  <section id="home" class="screen" hidden>
    <header class="h-top">
      <a class="back" href="index.html" aria-label="コース一覧へ">←</a>
      <span class="h-ti" id="hTitle"></span>
      <span class="h-mp">Lv <b id="hLv">1</b><i class="xp"><u id="hXp"></u></i><small id="hXpN"></small></span>
    </header>
    <div class="hero" data-overlay-ok>
      <div class="hero-c" id="hCircle"></div>
      <h1 class="logo"><small>有機化学クエスト</small>ユーキ<i>・</i>クエスト<span class="logo-en">YUKI QUEST</span></h1>
    </div>
    <button class="cta" id="hCta"></button>
    <div class="quick">
      <button class="qb" id="hBook"><span>📜</span>呪文書</button>
      <button class="qb" id="hTips"><span>💡</span>Tips</button>
      <button class="qb" id="hSet"><span>⚙</span>設定</button>
    </div>
    <div id="hMap"></div>
  </section>

  <!-- ============ トーク（レッスン） ============ -->
  <section id="talk" class="screen" hidden>
    <header class="t-head">
      <button id="tQuit" aria-label="やめる">✕</button>
      <div class="t-av" id="tAv"></div>
      <div class="t-mid"><b id="tTitle"></b><span id="tSub"></span></div>
      <div class="t-mp"><small>EXP</small><b id="tMp">0</b></div>
    </header>
    <main id="log" aria-live="polite"></main>
    <div id="tray"></div>
  </section>

  <!-- ============ 結果 ============ -->
  <section id="done" class="screen" hidden></section>

  <!-- ============ ボス戦 ============ -->
  <section id="battle" class="screen" hidden></section>
</div>

<!-- ============ 詠唱の儀式 ============ -->
<section id="ritual" hidden></section>

<div id="sheet" hidden><div class="sh"><button class="sh-close" aria-label="閉じる">✕</button><div id="sheetBody"></div></div></div>
<div id="slam"></div>
<div id="tipPop" hidden></div>

<script src="engine/js/audio.js?v=12"></script>

<script src="yuki/js/data/tips.js?v=9"></script>
<script src="yuki/js/data/lessons.js?v=11"></script>
<script src="yuki/js/data/side.js?v=2"></script>
<script src="yuki/js/data/bosses.js?v=10"></script>
<script src="yuki/js/ritual.js?v=11"></script>
<script src="yuki/js/talk.js?v=12"></script>
<script src="yuki/js/battle.js?v=13"></script>
<script src="yuki/js/app.js?v=99"></script>
<script src="news/news.js?v=2"></script>
</body>
</html>
