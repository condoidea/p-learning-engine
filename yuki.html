<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ユーキ・クエスト｜有機化学</title>
<meta name="theme-color" content="#0d0820">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@700;800&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="yuki/css/yuki.css?v=1">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- ============ はじまり（最初のタップで音と読み上げを使えるようにする） ============ -->
<button id="start" type="button">
  <span class="st-logo"><small>有機化学 ・ 共通テストの基本</small><b>ユーキ<i>・</i>クエスト</b><em>有機（ユーキ）を出せ！</em></span>
  <span class="st-press">― TAP TO START ―</span>
  <span class="st-note">🔊 BGM と詠唱の読み上げがあります（設定で切りかえ）</span>
</button>

<div id="app">
  <!-- ============ ホーム（地図） ============ -->
  <section id="home" class="screen" hidden>
    <header class="h-top">
      <a class="back" href="index.html" aria-label="コース一覧へ">←</a>
      <span class="h-ti" id="hTitle"></span>
      <span class="h-mp">魔力 <b id="hMp">0</b> MP</span>
    </header>
    <div class="hero">
      <div class="hero-c" id="hCircle"></div>
      <h1 class="logo"><small>有機化学クエスト</small>ユーキ<i>・</i>クエスト</h1>
    </div>
    <button class="cta" id="hCta"></button>
    <div class="quick">
      <button class="qb" id="hBook"><span>📜</span>呪文書</button>
      <button class="qb" id="hTips"><span>💡</span>Tips</button>
      <button class="qb" id="hSet"><span>⚙</span>設定</button>
    </div>
    <div id="hMap"></div>
  </section>

  <!-- ============ トーク（レッスン） ============ -->
  <section id="talk" class="screen" hidden>
    <header class="t-head">
      <button id="tQuit" aria-label="やめる">✕</button>
      <div class="t-av" id="tAv"></div>
      <div class="t-mid"><b id="tTitle"></b><span id="tSub"></span></div>
      <div class="t-mp"><small>MP</small><b id="tMp">0</b></div>
    </header>
    <main id="log" aria-live="polite"></main>
    <div id="tray"></div>
  </section>

  <!-- ============ 結果 ============ -->
  <section id="done" class="screen" hidden></section>

  <!-- ============ ボス戦 ============ -->
  <section id="battle" class="screen" hidden></section>
</div>

<!-- ============ 詠唱の儀式 ============ -->
<section id="ritual" hidden></section>

<div id="sheet" hidden><div class="sh"><button class="sh-close" aria-label="閉じる">✕</button><div id="sheetBody"></div></div></div>
<div id="slam"></div>
<div id="tipPop" hidden></div>

<script src="engine/js/audio.js?v=12"></script>
<script src="yuki/js/core.js?v=1"></script>
<script src="yuki/js/fx.js?v=1"></script>
<script src="yuki/js/bgm.js?v=1"></script>
<script src="yuki/js/voice.js?v=1"></script>
<script src="yuki/js/mol.js?v=1"></script>
<script src="yuki/js/data/spells.js?v=1"></script>
<script src="yuki/js/data/tips.js?v=1"></script>
<script src="yuki/js/data/lessons.js?v=1"></script>
<script src="yuki/js/data/bosses.js?v=1"></script>
<script src="yuki/js/ritual.js?v=1"></script>
<script src="yuki/js/talk.js?v=1"></script>
<script src="yuki/js/battle.js?v=1"></script>
<script src="yuki/js/app.js?v=1"></script>
<script src="news/news.js?v=2"></script>
</body>
</html>
