<!DOCTYPE html>
<html lang="ja" data-skin="espana">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>単語アプリ</title>
<meta name="theme-color" content="#f6ead6">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* デッキに合わせて、最初からスキン（色）と書体を決める（画面が一瞬ちがう見た目になるのを防ぐ）
 *  espana：¡VAMOS!（スペイン語）／avenue：WORD AVENUE（英語） */
(function () {
  var m = /[?&]deck=([a-z0-9-]+)/.exec(location.search), id = m ? m[1] : 'spanish';
  var skin = { 'juku-1009': 'avenue' }[id];
  if (!skin && id !== 'spanish') { try { var d = JSON.parse(localStorage.getItem('vocab.deck.' + id)); skin = d && (d.skin || (d.lang === 'en' ? 'avenue' : '')); } catch (e) { /* 保存領域が使えない */ } }
  skin = skin || 'espana';
  document.documentElement.setAttribute('data-skin', skin);
  var F = {
    espana: 'family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600;1,9..144,800&family=Zen+Maru+Gothic:wght@500;700;900',
    avenue: 'family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,600;1,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Shippori+Mincho:wght@500;700;800'
  };
  document.write('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?' + (F[skin] || F.espana) + '&display=swap">');
})();
</script>
<link rel="stylesheet" href="vocab/css/vocab.css?v=34">
<link rel="stylesheet" href="vocab/css/skin-espana.css?v=34">
<link rel="stylesheet" href="vocab/css/skin-avenue.css?v=34">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="app">

  <!-- ============ ホーム ============ -->
  <section id="home" class="screen">
    <header class="h-head anim">
      <a class="back" href="index.html">← コース一覧</a>
      <div class="brand"><b id="hBrand"></b><small id="hSub"></small></div>
      <button class="deck-btn" id="hDeck"></button>
    </header>
    <button class="boss-alert anim" id="hBoss" hidden></button>

    <div class="stats anim">
      <button class="st dex-st" data-go="dex"><small>📖 図鑑</small><b id="hDex"></b><span class="bar stack" id="hDexBar"></span><small class="rel" id="hRel"></small></button>
      <div class="st"><small>今日</small><b id="hExp"></b><span class="unit">EXP</span></div>
      <div class="st"><small>今日 育った</small><b id="hGrown"></b><span class="unit">枚</span></div>
    </div>
    <button class="range-btn anim" id="hRange" hidden></button>
    <div class="plaza anim" id="plaza"></div>
    <p class="plaza-note anim">近いほど定着。🥀 は今日のひと区切りの子</p>
    <p class="wild-note anim" id="hWild" hidden></p>
    <button class="want-note anim" id="hWant" hidden></button>

    <h2 class="sec anim">おまかせ<small>時間と気分で選ぶ</small></h2>
    <div class="omakase anim">
      <button data-min="1"><b>1</b><span>分</span><small>すきま時間</small></button>
      <button data-min="5"><b>5</b><span>分</span><small>いつもの</small></button>
      <button data-min="10"><b>10</b><span>分</span><small>じっくり</small></button>
    </div>
    <div class="mood anim">
      <button data-mood="firm">🧠 しっかり<small>新しい単語・つづり</small></button>
      <button data-mood="easy">😌 ゆるく<small>知っている単語だけ</small></button>
    </div>

    <h2 class="sec anim">アラカルト<small>やりたいものを直接</small></h2>
    <div class="alacarte anim" id="alacarte"></div>

    <div class="settings anim">
      <label><input type="checkbox" id="tgSound"> 🔈 効果音</label>
      <label id="tgSpeakRow"><input type="checkbox" id="tgSpeak"> 🗣 発音を読み上げ</label>
    </div>
  </section>

  <!-- ============ ボス戦 ============ -->
  <section id="bossScreen" class="screen" hidden></section>

  <!-- ============ 学習中 ============ -->
  <section id="play" class="screen" hidden>
    <header class="p-head">
      <button id="quit" aria-label="やめる">✕</button>
      <div class="p-mid"><span id="phase"></span><div id="steps"></div></div>
      <div id="pDexBox" class="p-dex">📖 <b id="pDex">0</b></div>
    </header>
    <main id="stage"></main>
  </section>

  <!-- ============ 結果 ============ -->
  <section id="done" class="screen" hidden>
    <h1 id="dTitle" class="anim"></h1>
    <ul id="dLines" class="anim"></ul>
    <div id="dCards" class="grid"></div>
    <p id="dNext" class="next-note anim"></p>
    <div class="d-btns anim">
      <button class="next" id="dMore">もう5分 ▶</button>
      <button class="ghost" data-go="home">ホームへ</button>
    </div>
  </section>

  <!-- ============ 活用 ============ -->
  <section id="conj" class="screen" hidden>
    <header class="x-head">
      <button class="ghost" data-go="home">← ホーム</button>
      <b>🔁 活用</b>
    </header>
    <p class="x-legend">1つのユニット＝1つの「くせ」。お手本を見て、予想してから練習。覚えた形は図鑑の「活用」に並び、しおれると野生戦に出てくる</p>
    <div id="cjList" class="units"></div>
  </section>

  <!-- ============ 図鑑 ============ -->
  <section id="dex" class="screen" hidden>
    <header class="x-head">
      <button class="ghost" data-go="home">← ホーム</button>
      <b>📖 図鑑</b><span id="xCount"></span>
    </header>
    <div class="x-tabs"><button data-tab="words">単語</button><button data-tab="conj">活用</button></div>
    <p class="x-legend" id="xLegend">🥀🍂 今日のひと区切りの子 ／ 💤 お昼寝中（強い子は少し待っても大丈夫）。タップで会いに行ける</p>
    <div id="xBody"></div>
    <button class="ghost danger" id="xReset">記録をリセット</button>
  </section>
</div>

<div id="sheet" hidden><div class="sh"><button class="sh-close" aria-label="閉じる">✕</button><div id="sheetBody"></div></div></div>
<div id="slam" hidden></div>
<input type="file" id="deckFile" accept=".json,application/json,text/plain" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="vocab/js/decks.js?v=34" data-load="1"></script>
<script src="vocab/decks/spanish/conj-units.js?v=34"></script>
<script src="vocab/js/conj-es.js?v=34"></script>
<script src="vocab/js/deck-check.js?v=34"></script>
<script src="vocab/js/core.js?v=34"></script>
<script src="vocab/js/chara.js?v=34"></script>
<script src="engine/js/audio.js?v=34"></script>
<script src="vocab/js/sound-es.js?v=34"></script>
<script src="vocab/js/sound-us.js?v=34"></script>
<script src="vocab/js/ui.js?v=34"></script>
</body>
</html>
